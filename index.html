  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

}

svg {

      height: 7px;

    }

      background: var(--background);

      overflow: auto;

    #computer-lab-seat-picker .cl-header {
      display: flex;
      align-items: center;

      gap: 12px;
      margin-bottom: 14px;

    }
    #computer-lab-seat-picker .cl-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    #computer-lab-seat-picker .cl-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--primary);
      color: var(--primary-foreground);
      display: grid;
      place-items: center;
      flex: none;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--primary) 28%, transparent);
    }
    #computer-lab-seat-picker .cl-logo svg {
      width: 20px;
      height: 20px;
    }
    #computer-lab-seat-picker .cl-title {
      font-weight: 500;
    }
    #computer-lab-seat-picker .cl-subtitle {
      color: var(--muted-foreground);
      margin-top: 2px;
    }
    #computer-lab-seat-picker .cl-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #computer-lab-seat-picker .cl-hidden {
      display: none;
    }
    #computer-lab-seat-picker .cl-board {
      position: relative;
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--foreground) 86%, var(--blue)),
        color-mix(in srgb, var(--foreground) 94%, var(--blue)));
      color: var(--background);
      text-align: center;
      padding: 16px 12px;
      margin-bottom: 17px;
      border-radius: 14px;
      font-weight: 500;
      letter-spacing: .35em;
      box-shadow: inset 0 2px 9px color-mix(in srgb, var(--background) 12%, transparent);
    }
    #computer-lab-seat-picker .cl-board::after {
      content: &quot;&quot;;
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: -7px;
      height: 7px;
      border-radius: 0 0 7px 7px;
      background: color-mix(in srgb, var(--orange) 45%, var(--muted));
    }
    #computer-lab-seat-picker .cl-room-card {
      position: relative;
      overflow: hidden;
    }
    #computer-lab-seat-picker .cl-room {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
      padding: 4px;
    }
    #computer-lab-seat-picker .cl-column {
      display: grid;
      gap: 10px;
    }
    #computer-lab-seat-picker .cl-desk {

      gap: 5px;

      min-height: 67px;
      border-radius: 13px;
      background: color-mix(in srgb, var(--muted) 80%, transparent);

      place-items: center;
      color: var(--muted-foreground);
    }
    #computer-lab-seat-picker .cl-seat {

      min-width: 0;
      min-height: 56px;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 13px 3px 5px;
      border-radius: 10px;
      background: var(--background);
      border: 1px solid var(--border);
      transition: transform .22s ease, opacity .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
      overflow: hidden;

      top: 4px;
      left: 6px;
      color: var(--muted-foreground);
    }

    }

      border-color: var(--primary);
      box-shadow: 0 4px 13px color-mix(in srgb, var(--primary) 22%, transparent);

    }
    #computer-lab-seat-picker .cl-seat.is-glowing::before {
      content: &quot;&quot;;
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;

    #computer-lab-seat-picker .cl-status {

      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;

    #computer-lab-seat-picker .cl-dim,
    #computer-lab-seat-picker .cl-heart,
    #computer-lab-seat-picker .cl-countdown,
    #computer-lab-seat-picker .cl-flash,

      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    #computer-lab-seat-picker .cl-dim {
      z-index: 20;

      transition: opacity .45s ease;
    }
    #computer-lab-seat-picker .cl-dim.is-on {

    #computer-lab-seat-picker .cl-heart {

    #computer-lab-seat-picker .cl-countdown {

      place-items: center;

    @keyframes cl-blink {

    }
    @keyframes cl-heartbeat {
      0%, 100% { opacity: 0; }
      16% { opacity: .95; }
      31% { opacity: .18; }
      42% { opacity: .72; }
      64% { opacity: 0; }
    }
    @keyframes cl-countdown-pop {

    @keyframes cl-flash {

      100% { opacity: 0; }

    @keyframes cl-shake-soft {
      0%, 100% { transform: translate(0, 0); }

    }
    @keyframes cl-shake-final {

      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, -2px); }

        { studentId: &#x27;21022&#x27;, name: &#x27;박서준&#x27; }, { studentId: &#x27;21023&#x27;, name: &#x27;박재영&#x27; },
        { studentId: &#x27;21025&#x27;, name: &#x27;이연&#x27; }, { studentId: &#x27;21026&#x27;, name: &#x27;이준서&#x27; },
        { studentId: &#x27;21030&#x27;, name: &#x27;황지후&#x27; }
      ];
      const desksPerColumn = [6, 5, 5];
      let seats = [];
      let shuffled = [];
      let phase = &#x27;idle&#x27;;
      let timers = [];
      let rollingTimer = null;
      let audioContext = null;
      let masterGain = null;
      let muted = false;

      function shuffle(values) {
        const result = [...values];
        for (let index = result.length - 1; index &gt; 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[randomIndex]] = [result[randomIndex], result[index]];
        }
        return result;
      }

      function buildRoom() {
        room.innerHTML = &#x27;&#x27;;
        seats = [];
        desksPerColumn.forEach((deskCount, columnIndex) =&gt; {
          const column = document.createElement(&#x27;div&#x27;);
          column.className = &#x27;cl-column&#x27;;
          for (let deskIndex = 0; deskIndex &lt; deskCount; deskIndex += 1) {
            const desk = document.createElement(&#x27;div&#x27;);
            const single = columnIndex === 0 &amp;&amp; deskIndex === 5;
            desk.className = `cl-desk${single ? &#x27; cl-desk-single&#x27; : &#x27;&#x27;}`;
            desk.setAttribute(&#x27;aria-label&#x27;, `${columnIndex + 1}열 ${deskIndex + 1}번째 책상`);
            const seatCount = single ? 1 : 2;
            for (let side = 0; side &lt; seatCount; side += 1) {
              const seat = document.createElement(&#x27;div&#x27;);
              const code = `${String.fromCharCode(65 + columnIndex)}${deskIndex + 1}${side === 0 ? &#x27;L&#x27; : &#x27;R&#x27;}`;
              seat.className = &#x27;cl-seat&#x27;;
              seat.innerHTML = `&lt;span class=&quot;cl-seat-code text-small&quot;&gt;${code}&lt;/span&gt;&lt;span class=&quot;cl-seat-number&quot;&gt;?&lt;/span&gt;&lt;span class=&quot;cl-seat-name&quot;&gt;?&lt;/span&gt;`;
              desk.appendChild(seat);
              seats.push({ element: seat, student: null, locked: false });
            }
            column.appendChild(desk);
          }
          room.appendChild(column);
        });
      }

      function showStudent(seat, student) {
        seat.element.querySelector(&#x27;.cl-seat-number&#x27;).textContent = student.studentId;
        seat.element.querySelector(&#x27;.cl-seat-name&#x27;).textContent = student.name;
      }

      function showQuestion(seat) {
        seat.element.querySelector(&#x27;.cl-seat-number&#x27;).textContent = &#x27;?&#x27;;
        seat.element.querySelector(&#x27;.cl-seat-name&#x27;).textContent = &#x27;?&#x27;;
      }

      function setStatus(text, active = false) {
        status.innerHTML = &#x27;&#x27;;
        const line = document.createElement(&#x27;span&#x27;);
        line.className = &#x27;cl-status-line&#x27;;
        if (active) {
          const dot = document.createElement(&#x27;span&#x27;);
          dot.className = &#x27;cl-dot&#x27;;
          dot.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          line.appendChild(dot);
        }
        line.appendChild(document.createTextNode(text));
        status.appendChild(line);

        timers.forEach(timer =&gt; {
          clearTimeout(timer);
          clearInterval(timer);
        });
        timers = [];
        if (rollingTimer) {
          clearInterval(rollingTimer);
          rollingTimer = null;
        }
      }

      function initAudio() {
        if (audioContext) {
          if (audioContext.state === &#x27;suspended&#x27;) audioContext.resume();
          return;
        }
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioContext = new AudioContextClass();
        masterGain = audioContext.createGain();
        masterGain.gain.value = muted ? 0 : .55;
        masterGain.connect(audioContext.destination);
      }

      function tone(frequency, duration, volume = .08, delay = 0, type = &#x27;sine&#x27;) {
        if (!audioContext || !masterGain || muted) return;
        const startAt = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(.0001, startAt);
        gain.gain.linearRampToValueAtTime(volume, startAt + .008);
        gain.gain.exponentialRampToValueAtTime(.0001, startAt + duration);
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + .03);
      }

      function playTick() {
        tone(820, .06, .055, 0, &#x27;square&#x27;);
      }

      function playDing(index) {
        const frequency = 640 + Math.min(index * 10, 300);
        tone(frequency, .24, .1);
        tone(frequency * 1.5, .2, .045, .025);
      }

      function playFanfare() {
        [523, 659, 784, 1047].forEach((frequency, index) =&gt; tone(frequency, .36, .11, index * .11, &#x27;triangle&#x27;));
      }

      function showCountdown() {
        phase = &#x27;countdown&#x27;;
        startButton.disabled = true;
        skipButton.classList.remove(&#x27;cl-hidden&#x27;);
        dimLayer.classList.add(&#x27;is-on&#x27;);
        heartLayer.classList.add(&#x27;is-on&#x27;);
        setStatus(&#x27;곧 추첨이 시작됩니다&#x27;, true);
        const numbers = [&#x27;3&#x27;, &#x27;2&#x27;, &#x27;1&#x27;];
        let index = 0;
        const next = () =&gt; {
          if (phase !== &#x27;countdown&#x27;) return;
          if (index &gt;= numbers.length) {
            countdownLayer.classList.remove(&#x27;is-on&#x27;);
            startRolling();
            return;
          }
          countdownNumber.textContent = numbers[index];
          countdownNumber.style.animation = &#x27;none&#x27;;
          void countdownNumber.offsetWidth;
          countdownNumber.style.animation = &#x27;&#x27;;
          countdownLayer.classList.add(&#x27;is-on&#x27;);
          playTick();
          index += 1;
          const timer = setTimeout(next, 720);
          timers.push(timer);
        };
        next();
      }

      function startRolling() {
        clearTimers();
        phase = &#x27;rolling&#x27;;
        shuffled = shuffle(students);
        seats.forEach((seat, index) =&gt; {
          seat.student = shuffled[index];
          seat.locked = false;
          seat.element.className = &#x27;cl-seat is-rolling&#x27;;
          showQuestion(seat);
        });
        room.classList.add(&#x27;is-shaking&#x27;);
        setStatus(&#x27;자리를 섞는 중…&#x27;, true);
        let ticks = 0;
        rollingTimer = setInterval(() =&gt; {
          seats.forEach(seat =&gt; showStudent(seat, students[Math.floor(Math.random() * students.length)]));
          if (ticks % 3 === 0) playTick();
          ticks += 1;
          if (ticks &gt;= 28) startReveal();
        }, 65);
      }

      function lockSeat(seat, index) {
        if (seat.locked) return;
        seat.locked = true;
        showStudent(seat, seat.student);
        seat.element.className = &#x27;cl-seat is-locked is-pop is-glowing&#x27;;
        playDing(index);
      }

      function startReveal() {
        if (phase === &#x27;revealing&#x27;) return;
        if (rollingTimer) {
          clearInterval(rollingTimer);
          rollingTimer = null;
        }
        phase = &#x27;revealing&#x27;;
        seats.forEach(seat =&gt; seat.element.className = &#x27;cl-seat is-rolling is-pending&#x27;);
        setStatus(`자리를 확정하는 중 · 남은 자리 ${seats.length}개`, true);
        seats.forEach((seat, index) =&gt; {
          const timer = setTimeout(() =&gt; {
            if (phase !== &#x27;revealing&#x27;) return;
            lockSeat(seat, index);
            setStatus(`자리를 확정하는 중 · 남은 자리 ${seats.length - index - 1}개`, true);
          }, index * 125);
          timers.push(timer);
        });
        const finishTimer = setTimeout(finish, seats.length * 125 + 380);
        timers.push(finishTimer);
      }

      function startConfetti() {
        const bounds = root.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        confettiCanvas.width = Math.max(1, Math.round(bounds.width * ratio));
        confettiCanvas.height = Math.max(1, Math.round(bounds.height * ratio));
        confettiCanvas.style.opacity = &#x27;1&#x27;;
        const context = confettiCanvas.getContext(&#x27;2d&#x27;);
        context.scale(ratio, ratio);
        const styles = getComputedStyle(root);
        const colors = [&#x27;--blue&#x27;, &#x27;--red&#x27;, &#x27;--yellow&#x27;, &#x27;--green&#x27;, &#x27;--purple&#x27;, &#x27;--orange&#x27;]
          .map(token =&gt; styles.getPropertyValue(token).trim())
          .filter(Boolean);
        const palette = colors.length ? colors : [styles.getPropertyValue(&#x27;--primary&#x27;).trim()];
        const pieces = Array.from({ length: 100 }, () =&gt; ({
          x: Math.random() * bounds.width,
          y: -15 - Math.random() * bounds.height * .35,
          width: 5 + Math.random() * 5,
          height: 7 + Math.random() * 7,
          velocityX: -1 + Math.random() * 2,
          velocityY: 2 + Math.random() * 3,
          rotation: Math.random() * Math.PI * 2,
          rotationVelocity: -.14 + Math.random() * .28,
          color: palette[Math.floor(Math.random() * palette.length)]
        }));
        const startedAt = performance.now();
        const frame = now =&gt; {
          context.clearRect(0, 0, bounds.width, bounds.height);
          pieces.forEach(piece =&gt; {
            piece.x += piece.velocityX;
            piece.y += piece.velocityY;
            piece.rotation += piece.rotationVelocity;
            context.save();
            context.translate(piece.x, piece.y);
            context.rotate(piece.rotation);
            context.fillStyle = piece.color;
            context.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height);
            context.restore();
          });
          if (now - startedAt &lt; 2600) {
            requestAnimationFrame(frame);
          } else {
            context.clearRect(0, 0, bounds.width, bounds.height);
            confettiCanvas.style.opacity = &#x27;0&#x27;;
          }
        };
        requestAnimationFrame(frame);
      }

      function finish() {
        if (phase === &#x27;done&#x27;) return;
        phase = &#x27;done&#x27;;
        clearTimers();
        seats.forEach((seat, index) =&gt; {
          if (!seat.locked) lockSeat(seat, index);
          seat.element.classList.remove(&#x27;is-pending&#x27;, &#x27;is-rolling&#x27;);
        });
        room.classList.remove(&#x27;is-shaking&#x27;);
        room.classList.add(&#x27;is-final-shake&#x27;);
        const shakeTimer = setTimeout(() =&gt; room.classList.remove(&#x27;is-final-shake&#x27;), 550);
        timers.push(shakeTimer);
        dimLayer.classList.remove(&#x27;is-on&#x27;);
        heartLayer.classList.remove(&#x27;is-on&#x27;);
        countdownLayer.classList.remove(&#x27;is-on&#x27;);
        flashLayer.classList.add(&#x27;is-on&#x27;);
        const flashTimer = setTimeout(() =&gt; flashLayer.classList.remove(&#x27;is-on&#x27;), 750);
        timers.push(flashTimer);
        playFanfare();
        startConfetti();
        startButton.disabled = false;
        startButton.textContent = &#x27;다시 뽑기&#x27;;
        skipButton.classList.add(&#x27;cl-hidden&#x27;);
        setStatus(&#x27;자리 배치 완료! 31명이 모두 배정되었습니다&#x27;);
      }

      function skip() {
        if (phase === &#x27;countdown&#x27;) {
          clearTimers();
          countdownLayer.classList.remove(&#x27;is-on&#x27;);
          startRolling();
        } else if (phase === &#x27;rolling&#x27;) {
          startReveal();
        } else if (phase === &#x27;revealing&#x27;) {
          clearTimers();
          seats.forEach((seat, index) =&gt; lockSeat(seat, index));
          finish();
        }
      }

      function start() {
        if ([&#x27;countdown&#x27;, &#x27;rolling&#x27;, &#x27;revealing&#x27;].includes(phase)) return;
        clearTimers();
        initAudio();
        room.classList.remove(&#x27;is-shaking&#x27;, &#x27;is-final-shake&#x27;);
        dimLayer.classList.remove(&#x27;is-on&#x27;);
        heartLayer.classList.remove(&#x27;is-on&#x27;);
        flashLayer.classList.remove(&#x27;is-on&#x27;);
        seats.forEach(seat =&gt; {
          seat.locked = false;
          seat.student = null;
          seat.element.className = &#x27;cl-seat&#x27;;
          showQuestion(seat);
        });
        startButton.textContent = &#x27;자리 뽑기 시작&#x27;;
        showCountdown();
      }

      function toggleMute() {
        muted = !muted;
        if (masterGain) masterGain.gain.value = muted ? 0 : .55;
        muteButton.textContent = muted ? &#x27;🔇&#x27; : &#x27;🔊&#x27;;
        muteButton.setAttribute(&#x27;aria-label&#x27;, muted ? &#x27;효과음 켜기&#x27; : &#x27;효과음 끄기&#x27;);
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (root.requestFullscreen) root.requestFullscreen();
        } else if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }

      startButton.addEventListener(&#x27;click&#x27;, start);
      skipButton.addEventListener(&#x27;click&#x27;, skip);
      muteButton.addEventListener(&#x27;click&#x27;, toggleMute);
      fullscreenButton.addEventListener(&#x27;click&#x27;, toggleFullscreen);

      buildRoom();
      setStatus(&#x27;버튼을 누르면 31명의 자리가 무작위로 배정됩니다 · 칠판 쪽이 앞줄&#x27;);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

    } else {

    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

(() =&gt; {
